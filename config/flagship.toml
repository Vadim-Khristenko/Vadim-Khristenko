# ─────────────────────────────────────────────────────────────────────────────
# flagship.toml: the coolest projects, rendered with LIVE stats.
#
# repo   → looked up across every configured provider (mirror-aware: stars,
#          forks and open items are summed across platforms).
# prefer → which platform's copy headlines the row (falls back to any hit).
# Order is the order on the card: the top repo goes first.
# ─────────────────────────────────────────────────────────────────────────────

